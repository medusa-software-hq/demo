[versions]
detekt = "1.23.8"
fabrikt = "1.39.1"
kotlin = "2.4.10"
kotlin-coroutines = "1.10.2"
ksp = "2.3.11"
ktfmt = "0.27.0"
logback = "1.5.32"
micronaut-plugin = "4.6.2" # The last of the 4.x line, supporting Java 21
shadow = "9.6.1"
versionCatalogUpdate = "1.1.1"
flyway = "13.6.0"
hikari = "7.1.0"
postgresql = "42.7.13"
testcontainers = "1.21.4"
zonky-embedded-postgres = "2.2.2"
# The Postgres this is. The BOM also lifts the amd64 bundles embedded-postgres pins for itself, so
# every platform runs the same major — the one Neon provisions.
zonky-embedded-postgres-binaries = "18.6.0"
sqldelight = "2.3.2"
temporal = "1.38.0"
# The CLI whose `server start-dev` is the local stack's Temporal. Downloaded by the build, not a
# Maven artifact; here so every project that runs a stack names the same one.
temporal-cli = "1.8.3"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlin-coroutines" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
zonky-embedded-postgres = { module = "io.zonky.test:embedded-postgres", version.ref = "zonky-embedded-postgres" }
zonky-embedded-postgres-binaries-bom = { module = "io.zonky.test.postgres:embedded-postgres-binaries-bom", version.ref = "zonky-embedded-postgres-binaries" }
zonky-embedded-postgres-binaries-darwin-arm64v8 = { module = "io.zonky.test.postgres:embedded-postgres-binaries-darwin-arm64v8" }
zonky-embedded-postgres-binaries-linux-arm64v8 = { module = "io.zonky.test.postgres:embedded-postgres-binaries-linux-arm64v8" }
sqldelight-jdbc-driver = { module = "app.cash.sqldelight:jdbc-driver", version.ref = "sqldelight" }
sqldelight-postgresql-dialect = { module = "app.cash.sqldelight:postgresql-dialect", version.ref = "sqldelight" }

temporal-sdk = { module = "io.temporal:temporal-sdk", version.ref = "temporal" }

[plugins]
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
fabrikt = { id = "ch.acanda.gradle.fabrikt", version.ref = "fabrikt" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
ktfmt = { id = "com.ncorti.ktfmt.gradle", version.ref = "ktfmt" }
micronaut-library = { id = "io.micronaut.library", version.ref = "micronaut-plugin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
versionCatalogUpdate = { id = "nl.littlerobots.version-catalog-update", version.ref = "versionCatalogUpdate" }
