version: '3'

includes:
  gradleRoot:
    taskfile: gradle.Taskfile.yml
    dir: .

  github:
    taskfile: github.Taskfile.yml
    dir: .

  client:
    taskfile: api/client/Taskfile.yml
    dir: api/client

  deploy:
    taskfile: deploy/Taskfile.yml
    dir: deploy

  frontend:
    taskfile: frontend/Taskfile.yml
    dir: frontend

  infra:
    taskfile: infra/Taskfile.yml
    dir: infra

  systemTests:
    taskfile: system-tests/Taskfile.yml
    dir: system-tests

  worker:
    taskfile: worker/Taskfile.yml
    dir: worker

tasks:
  fixAll:
    desc: Apply all automatic fixes
    deps:
      - github:fixLint
      - gradleRoot:fixFormatting
      - client:fixFormatting
      - client:fixLint
      - deploy:fixFormatting
      - deploy:fixLint
      - frontend:fixFormatting
      - frontend:fixLint
      - infra:fixFormatting
      - infra:fixLint
      - systemTests:fixFormatting
      - systemTests:fixLint
      - worker:fixFormatting
      - worker:fixLint
