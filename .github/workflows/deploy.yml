name: Deploy

on:
  push:
    branches: [main]

# What the called workflow needs, granted here because a called workflow can hold no
# more than its caller does. `id-token` is how it federates into Google Cloud to read
# the Pulumi credential; nothing here ever sees that credential.
permissions:
  contents: read
  id-token: write

jobs:
  # Before anything is deployed, because what gets deployed is this.
  #
  # The image is named after the sources it is built from, so a commit that leaves the
  # service alone finds it already built and does nothing at all.
  image:
    name: Image
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/push-image.yml

  deploy:
    name: Deploy
    needs: image
    # The steps live in the platform repository, not here.
    #
    # They hold a Pulumi credential that carries the whole account, so what happens to
    # it must not be this repository's to change. The identity that reads it is issued
    # only to this workflow file at this ref — `job_workflow_ref` names the *called*
    # workflow — so copying these steps into this repository would produce an
    # assertion Google Cloud refuses.
    #
    # Which app is deployed is not passed in. It comes from the repository that
    # called, so asking can only ever deploy this one.
    uses: medusa-software-hq/platform/.github/workflows/deploy.yml@main
