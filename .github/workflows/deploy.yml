name: Deploy

on:
  push:
    branches: [main]

  # And once a day, deploying whatever `main` already is.
  #
  # Not for the deployment: for the key. The edge holds a service account key that
  # expires after a week, and a deployment is the only thing here holding the
  # Cloudflare credential needed to hand over a new one — so rotation has to be a
  # deployment, and a deployment that only happens on merge is a deployment that
  # stops happening. Daily against a weekly expiry leaves six missed runs survivable
  # and the seventh not, which is the property worth having.
  schedule:
    # Nothing depends on the hour. Off the hour, because everything else runs on it.
    - cron: '17 3 * * *'

  workflow_dispatch:

# `id-token` is how each job below federates into Google Cloud to read what it needs:
# the Pulumi credential, and the tokens that get past the login in front of the app.
# None of them is in this repository's settings; each is read at run time, from a secret
# only the federated identity may open.
permissions:
  contents: read
  id-token: write

env:
  NO_COLOR: 1

# One sequence at a time.
#
# Keyed on the repository rather than the ref or the commit: keyed on either of those
# it would be no lock at all, and this lock is what keeps "production deploys what
# staging just served" true when two merges land close together. A third run replaces
# the one waiting, which is right — the newest commit contains the one it replaces.
#
# Never cancelling in progress, because these jobs do not do the work. Cancelling one
# would abandon a running deployment rather than stop it, and lose the only thing
# watching how it ends.
concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

# The order is the jobs'. Staging is deployed, then tested from outside, and production
# is only touched once both have passed — every job at the same commit, `github.sha`.
#
# All of the steps are in this file, and have to be. The identity that reads the
# credentials is issued against `job_workflow_ref`, which names the workflow that
# *defines* the running job; the platform builds the expected value from this
# repository, so it is this file at this path on `main`. Moving jobs into a workflow
# this one calls would assert that file's path instead, and be refused. That is why the
# two deploy jobs repeat each other rather than share a workflow.
jobs:
  # Before anything is deployed, because what gets deployed is this.
  #
  # The image is named after the sources it is built from, so a commit that leaves the
  # service alone finds it already built and does nothing at all.
  image:
    name: Image
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/push-image.yml

  deploy-staging:
    name: Deploy staging
    needs: image
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: deploy/.nvmrc

      # Federated, not stored. The assertion has to satisfy a condition naming this
      # workflow file at this ref, so a token minted for anything else is refused.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.DEPLOY_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

      # And the token the smoke test presents to the sign-in in front of every app, which
      # admits it as a service rather than as a person.
      - name: Read the Pulumi token and the smoke test's token
        id: token
        uses: google-github-actions/get-secretmanager-secrets@v3.0.0
        with:
          secrets: |-
            pulumi:${{ vars.DEPLOY_TOKEN_SECRET }}
            smokeTest:${{ vars.DEPLOY_SMOKE_TEST_SECRET }}

      # The remote automation API drives the Pulumi CLI rather than the REST API, so
      # the binary has to be here even though none of the work happens here.
      - name: Install Pulumi
        uses: pulumi/actions@v7.0.0

      - name: Install dependencies
        run: npm ci

      - name: Deploy staging
        env:
          PULUMI_ACCESS_TOKEN: ${{ steps.token.outputs.pulumi }}
          PULUMI_ORGANIZATION: ${{ vars.PULUMI_ORGANIZATION }}
          SMOKE_TEST_ACCESS_TOKEN: ${{ steps.token.outputs.smokeTest }}
          DEPLOY_ENVIRONMENTS: ${{ vars.DEPLOY_ENVIRONMENTS }}
          DEPLOY_HOSTNAMES: ${{ vars.DEPLOY_HOSTNAMES }}
        run: node src/main.ts staging

  # Staging, from outside, the way a browser reaches it: past the real login, through the
  # real Worker, into the real project. What only exists once something is deployed —
  # a permission a resource was never given, a third party answering differently from
  # what a test double said — is found here, and stops production being touched.
  test-staging:
    name: Test staging
    needs: deploy-staging
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: system-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: system-tests/.nvmrc

      # Refused loudly rather than skipped: a gate that quietly stops running is worse
      # than no gate, because it still looks like one.
      - name: Check staging admits test services
        env:
          TESTED: ${{ vars.DEPLOY_SYSTEM_TESTED_ENVIRONMENTS }}
        run: |
          case ",$TESTED," in
            *,staging,*) ;;
            *)
              echo "::error::The platform admits no test services on staging (tested: '$TESTED')"
              exit 1
              ;;
          esac

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.DEPLOY_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

      # The two services the tests call as, which the login admits on staging alone.
      - name: Read the system tests' tokens
        id: token
        uses: google-github-actions/get-secretmanager-secrets@v3.0.0
        with:
          secrets: |-
            systemTests:${{ vars.DEPLOY_SYSTEM_TEST_SECRET }}

      # The tests call the API through `demo-client`, linked in from next door, whose
      # generated half is not committed.
      - name: Install the client's dependencies
        working-directory: api/client
        run: npm ci

      - name: Generate the wire client
        working-directory: api/client
        run: npm run generate

      - name: Install dependencies
        run: npm ci

      - name: Test staging
        env:
          SYSTEM_TESTS_ORIGIN: https://${{ fromJSON(vars.DEPLOY_HOSTNAMES).staging }}
          SYSTEM_TESTS_SERVICE_TOKENS: ${{ steps.token.outputs.systemTests }}
        run: npm test

  # The same steps as `deploy-staging`, for production — see the note above the jobs for
  # why they are repeated rather than shared.
  deploy-production:
    name: Deploy production
    needs: test-staging
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: deploy/.nvmrc

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.DEPLOY_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

      - name: Read the Pulumi token and the smoke test's token
        id: token
        uses: google-github-actions/get-secretmanager-secrets@v3.0.0
        with:
          secrets: |-
            pulumi:${{ vars.DEPLOY_TOKEN_SECRET }}
            smokeTest:${{ vars.DEPLOY_SMOKE_TEST_SECRET }}

      - name: Install Pulumi
        uses: pulumi/actions@v7.0.0

      - name: Install dependencies
        run: npm ci

      - name: Deploy production
        env:
          PULUMI_ACCESS_TOKEN: ${{ steps.token.outputs.pulumi }}
          PULUMI_ORGANIZATION: ${{ vars.PULUMI_ORGANIZATION }}
          SMOKE_TEST_ACCESS_TOKEN: ${{ steps.token.outputs.smokeTest }}
          DEPLOY_ENVIRONMENTS: ${{ vars.DEPLOY_ENVIRONMENTS }}
          DEPLOY_HOSTNAMES: ${{ vars.DEPLOY_HOSTNAMES }}
        run: node src/main.ts production
