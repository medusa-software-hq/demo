name: Deploy

on:
  push:
    branches: [main]

  # And once a day, deploying whatever `main` already is.
  #
  # Not for the deployment: for the key. The edge holds a service account key that
  # expires after a week, and a deployment is the only thing here holding the
  # Cloudflare credential needed to hand over a new one — so rotation has to be a
  # deployment, and a deployment that only happens on merge is a deployment that
  # stops happening. Daily against a weekly expiry leaves six missed runs survivable
  # and the seventh not, which is the property worth having.
  schedule:
    # Nothing depends on the hour. Off the hour, because everything else runs on it.
    - cron: '17 3 * * *'

  workflow_dispatch:

# `id-token` is how the deploy job federates into Google Cloud to read the Pulumi
# credential. Nothing here ever sees that credential in this repository's settings:
# it is read at run time, from a secret only the federated identity may open.
permissions:
  contents: read
  id-token: write

env:
  NO_COLOR: 1

# One sequence at a time.
#
# Keyed on the repository rather than the ref or the commit: keyed on either of those
# it would be no lock at all, and this lock is what keeps "production deploys what
# staging just served" true when two merges land close together. A third run replaces
# the one waiting, which is right — the newest commit contains the one it replaces.
#
# Never cancelling in progress, because this job does not do the work. Cancelling it
# would abandon a running deployment rather than stop it, and lose the only thing
# watching how it ends.
concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # Before anything is deployed, because what gets deployed is this.
  #
  # The image is named after the sources it is built from, so a commit that leaves the
  # service alone finds it already built and does nothing at all.
  image:
    name: Image
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/push-image.yml

  deploy:
    name: Deploy
    needs: image
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: deploy

    # These steps are here, and have to be here.
    #
    # The identity that reads the Pulumi credential is issued against
    # `job_workflow_ref`, which names the workflow that *defines* the running job. The
    # platform stack builds the expected value from the repository that asked, so it is
    # this file at this path on this branch — and a job that delegated to another
    # workflow of this repository's own would assert that one's path and be refused.
    #
    # What the steps do is this repository's business now, which is the point of them
    # being here. What that costs is equally plain: a workflow that can run these can
    # use the Pulumi credential for whatever it permits.
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: deploy/.nvmrc

      # Federated, not stored. The assertion has to satisfy a condition naming this
      # workflow file at this ref, so a token minted for anything else is refused.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.DEPLOY_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

      # And the token the smoke test presents to the sign-in in front of every app, which
      # admits it as a service rather than as a person.
      - name: Read the Pulumi token and the smoke test's token
        id: token
        uses: google-github-actions/get-secretmanager-secrets@v3.0.0
        with:
          secrets: |-
            pulumi:${{ vars.DEPLOY_TOKEN_SECRET }}
            smokeTest:${{ vars.DEPLOY_SMOKE_TEST_SECRET }}

      # The remote automation API drives the Pulumi CLI rather than the REST API, so
      # the binary has to be here even though none of the work happens here.
      - name: Install Pulumi
        uses: pulumi/actions@v7.0.0

      - name: Install dependencies
        run: npm ci

      # Which environments, in what order, and where each answers are not this
      # repository's to decide — they come from the stack that creates them.
      - name: Deploy every environment, in order
        env:
          PULUMI_ACCESS_TOKEN: ${{ steps.token.outputs.pulumi }}
          PULUMI_ORGANIZATION: ${{ vars.PULUMI_ORGANIZATION }}
          SMOKE_TEST_ACCESS_TOKEN: ${{ steps.token.outputs.smokeTest }}
          DEPLOY_ENVIRONMENTS: ${{ vars.DEPLOY_ENVIRONMENTS }}
          DEPLOY_HOSTNAMES: ${{ vars.DEPLOY_HOSTNAMES }}
        run: node src/main.ts
