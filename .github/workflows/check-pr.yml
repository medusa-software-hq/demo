name: Check PR

on:
  pull_request:

permissions:
  contents: read

jobs:
  check-gh-workflows:
    name: GitHub workflows
    uses: ./.github/workflows/check-gh-workflows.yml

  check-backend:
    name: Backend
    uses: ./.github/workflows/check-backend.yml

  check-client:
    name: Client
    uses: ./.github/workflows/check-client.yml

  check-deploy:
    name: Deploy
    uses: ./.github/workflows/check-deploy.yml

  check-frontend:
    name: Frontend
    uses: ./.github/workflows/check-frontend.yml

  check-infra:
    name: Infra
    uses: ./.github/workflows/check-infra.yml

  check-worker:
    name: Worker
    uses: ./.github/workflows/check-worker.yml
