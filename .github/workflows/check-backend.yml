name: Check backend

on:
  workflow_call:

permissions:
  contents: read

env:
  NO_COLOR: 1

jobs:
  check-backend:
    name: Check backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          # The version the build's own toolchain asks for, so the wrapper does not
          # have to go and fetch a second one.
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6.3.0

      # `build` is compile, generate, format check, detekt and test in one — including
      # the tests that start the service and call it over HTTP.
      - name: Run `gradle build`
        run: ./gradlew build

      # A Dockerfile that does not build is a broken merge, and this is the cheapest
      # place to find out. Not pushed: a pull request has no registry to write to.
      - name: Build the image
        run: |
          ./gradlew :backend:service:cloud-run:installDist
          docker build \
            --file backend/service/entries/cloud-run/Dockerfile \
            backend/service/entries/cloud-run
