name: Check frontend

on:
  workflow_call:

permissions:
  contents: read

env:
  NO_COLOR: 1

jobs:
  check-frontend:
    name: Check frontend source
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: frontend/.nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Run `oxfmt`
        run: npx --no-install oxfmt --check "**/*.{ts,tsx,css}"

      - name: Run `oxlint`
        # `--type-aware` is where the rules that need the type checker live.
        run: npx --no-install oxlint --type-aware

      - name: Run `tsc`
        # Two programs: the app runs in a browser, the build configuration runs in Node.
        run: |
          npx --no-install tsc --noEmit -p tsconfig.app.json
          npx --no-install tsc --noEmit -p tsconfig.node.json

      - name: Run `vite build`
        # The deployment builds this too, but only once it has credentials and a stack
        # to plan against. Here it is the cheapest thing that can fail, and it fails on
        # its own.
        run: npm run build
