openapi: 3.0.3
info:
  title: Demo API
  version: 1.0.0
  description: >-
    Counters, which everyone shares, and todos, which are each caller's own. Who is calling is
    not a parameter of any operation: the gateway in front of the API names the caller, and an
    operation on personal data answers for them and nobody else.

paths:
  /counters:
    get:
      operationId: listCounters
      tags: [RawCounter]
      summary: List every counter that exists, oldest first.
      responses:
        "200":
          description: The counters, which may be none.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RawCounterListReply" }

    post:
      operationId: createCounter
      tags: [RawCounter]
      summary: Create a counter, starting at zero.
      responses:
        "200":
          description: The counter that was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RawCounterCreatedReply" }

  /counters/{counterId}:
    delete:
      operationId: deleteCounter
      tags: [RawCounter]
      summary: Delete a counter.
      parameters:
        - $ref: "#/components/parameters/CounterId"
      responses:
        "204":
          description: The counter is gone.
        "404":
          description: No counter has that id.

  /counters/{counterId}/get:
    get:
      operationId: getCount
      tags: [RawCounter]
      summary: Read a counter's current count.
      parameters:
        - $ref: "#/components/parameters/CounterId"
      responses:
        "200":
          description: The current count.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RawCountReply" }
        "404":
          description: No counter has that id.

  /counters/{counterId}/increment:
    post:
      operationId: incrementCount
      tags: [RawCounter]
      summary: Add one to a counter and return its new count.
      parameters:
        - $ref: "#/components/parameters/CounterId"
      responses:
        "200":
          description: The count after incrementing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RawCountReply" }
        "404":
          description: No counter has that id.

  /counters/{counterId}/decrement:
    post:
      operationId: decrementCount
      tags: [RawCounter]
      summary: Subtract one from a counter and return its new count.
      parameters:
        - $ref: "#/components/parameters/CounterId"
      responses:
        "200":
          description: The count after decrementing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RawCountReply" }
        "404":
          description: No counter has that id.

  /todos:
    get:
      operationId: listTodos
      tags: [RawTodo]
      summary: List the caller's own todos, oldest first.
      responses:
        "200":
          description: The caller's todos, which may be none.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RawTodoListReply" }

    post:
      operationId: createTodo
      tags: [RawTodo]
      summary: Add a todo for the caller, not done yet.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RawTodoCreation" }
      responses:
        "200":
          description: The todo that was added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RawTodoCreatedReply" }
        "400":
          description: The title is blank.

  /todos/{todoId}:
    delete:
      operationId: deleteTodo
      tags: [RawTodo]
      summary: Delete one of the caller's todos.
      parameters:
        - $ref: "#/components/parameters/TodoId"
      responses:
        "204":
          description: The todo is gone.
        "404":
          description: >-
            The caller has no todo with that id — including when somebody else does, which is
            deliberately not told apart.

  /todos/{todoId}/done:
    put:
      operationId: setTodoDone
      tags: [RawTodo]
      summary: Mark one of the caller's todos done, or not done.
      parameters:
        - $ref: "#/components/parameters/TodoId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RawTodoDoneUpdate" }
      responses:
        "204":
          description: The todo is now as asked.
        "404":
          description: >-
            The caller has no todo with that id — including when somebody else does, which is
            deliberately not told apart.

components:
  parameters:
    CounterId:
      name: counterId
      in: path
      required: true
      description: The counter's id.
      schema: { type: string }

    TodoId:
      name: todoId
      in: path
      required: true
      description: The todo's id.
      schema: { type: string }

  schemas:
    RawCounterCreatedReply:
      type: object
      required: [counterId]
      properties:
        counterId:
          type: string
          description: The new counter's id.

    RawCounter:
      type: object
      required: [counterId, count]
      properties:
        counterId:
          type: string
          description: The counter's id.
        count:
          type: integer
          format: int64
          description: The counter's value.

    RawCounterListReply:
      type: object
      required: [counters]
      properties:
        counters:
          type: array
          description: >-
            Every counter, oldest first. Ordered because a page rendering these should not
            reshuffle them between one reading and the next.
          items: { $ref: "#/components/schemas/RawCounter" }

    RawCountReply:
      type: object
      required: [count]
      properties:
        count:
          type: integer
          format: int64
          description: The counter's value.

    RawTodo:
      type: object
      required: [todoId, title, done]
      properties:
        todoId:
          type: string
          description: The todo's id.
        title:
          type: string
          description: What is to be done.
        done:
          type: boolean
          description: Whether it has been.

    RawTodoListReply:
      type: object
      required: [todos]
      properties:
        todos:
          type: array
          description: The caller's todos, oldest first.
          items: { $ref: "#/components/schemas/RawTodo" }

    RawTodoCreation:
      type: object
      required: [title]
      properties:
        title:
          type: string
          description: What is to be done. Not blank.

    RawTodoCreatedReply:
      type: object
      required: [todoId]
      properties:
        todoId:
          type: string
          description: The new todo's id.

    RawTodoDoneUpdate:
      type: object
      required: [done]
      properties:
        done:
          type: boolean
          description: Whether the todo is done.
