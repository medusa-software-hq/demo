# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  install:
    desc: Install dependencies

    # Every other task depends on this one, and `fixAll` runs several of them at once.
    # Task re-runs a dependency per dependent by default, so without this two installs
    # start in the same directory before either finishes — the fingerprint below cannot
    # help, because neither has produced anything yet when the other checks.
    run: once
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules/.package-lock.json
    cmds:
      # `ci` installs strictly from the lockfile
      - npm ci

  client:
    desc: Generate the wire client the tests call the API through
    # `demo-client` is linked in from next door, and its generated half is not committed —
    # linking cannot produce what was never there.
    run: once
    dir: ../api/client
    sources:
      - package.json
      - package-lock.json
      - openapi-ts.config.ts
      - ../openapi/demo.yaml
    generates:
      - src/gen/sdk.gen.ts
    cmds:
      - npm ci
      - npm run generate

  worker:
    desc: Install what the Worker is bundled with
    # The Worker is bundled from its own sources, which resolve their dependencies from their
    # own directory rather than from this one.
    run: once
    dir: ../worker
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules/.package-lock.json
    cmds:
      - npm ci

  stack:
    desc: Build the local stack the tests start, and the Temporal CLI it runs
    run: once
    dir: ..
    cmds:
      - ./gradlew :backend:local-stack:installDist :backend:local-stack:installTemporalCli --console=plain

  checkFormatting:
    desc: Check package formatting
    deps: [install]
    cmds:
      - npx --no-install oxfmt --check "**/*.ts"

  fixFormatting:
    desc: Fix package formatting
    deps: [install]
    cmds:
      - npx --no-install oxfmt --write "**/*.ts"

  lint:
    desc: Lint the package
    deps: [install, client]
    cmds:
      # `--type-aware` is where the rules that need the type checker live, and they are the ones
      # that catch conditions which cannot be false.
      - npx --no-install oxlint --type-aware

  fixLint:
    desc: Fix lint issues in the package
    deps: [install, client]
    cmds:
      - npx --no-install oxlint --type-aware --fix

  typecheck:
    desc: Type check the package
    deps: [install, client]
    cmds:
      - npx --no-install tsc --noEmit

  test:
    desc: Test the system, on a stack started here
    deps: [install, client, worker, stack]
    cmds:
      # Defined in `package.json`, so this and CI run the same command.
      - npm test

  testStaging:
    desc: Test the deployed staging environment
    deps: [install, client]
    requires:
      vars: [SYSTEM_TESTS_SERVICE_TOKENS]
    env:
      SYSTEM_TESTS_ORIGIN: https://demo-staging.medusa.software
    cmds:
      - npm test
