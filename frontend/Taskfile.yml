# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  install:
    desc: Install dependencies

    # Every other task depends on this one, and `fixAll` runs several of them at once.
    # Task re-runs a dependency per dependent by default, so without this two installs
    # start in the same directory before either finishes — the fingerprint below cannot
    # help, because neither has produced anything yet when the other checks.
    run: once
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules/.package-lock.json
    cmds:
      # `ci` installs strictly from the lockfile
      - npm ci

  client:
    desc: Generate the wire client this app is built against
    # `demo-client` lives next door and is linked into this package by `install`, but the half of
    # it that is generated from the contract is not committed — and linking cannot produce what
    # was never there. Its own Taskfile does the same two things; this is how the app's tasks
    # reach them, since a task cannot depend on one in another include.
    run: once
    dir: ../api/client
    sources:
      - package.json
      - package-lock.json
      - ../openapi/demo.yaml
    generates:
      - src/gen/sdk.gen.ts
    cmds:
      - npm ci
      - npm run generate

  checkFormatting:
    desc: Check package formatting
    deps: [install]
    cmds:
      - npx --no-install oxfmt --check "**/*.{ts,tsx,css}"

  fixFormatting:
    desc: Fix package formatting
    deps: [install]
    cmds:
      - npx --no-install oxfmt --write "**/*.{ts,tsx,css}"

  lint:
    desc: Lint the package
    deps: [install, client]
    cmds:
      # `--type-aware` is where the rules that need the type checker live, and they are the ones
      # that catch conditions which cannot be false.
      - npx --no-install oxlint --type-aware

  fixLint:
    desc: Fix lint issues in the package
    deps: [install, client]
    cmds:
      - npx --no-install oxlint --type-aware --fix

  typecheck:
    desc: Type check the package
    deps: [install, client]
    cmds:
      # Two programs, checked separately: the app runs in a browser and the build
      # configuration runs in Node, and neither one's globals should be visible to the
      # other.
      - npx --no-install tsc --noEmit -p tsconfig.app.json
      - npx --no-install tsc --noEmit -p tsconfig.node.json

  build:
    desc: Build the app
    deps: [install, client]
    cmds:
      - npm run build

  dev:
    desc: Serve the app with hot reloading
    deps: [install, client]
    interactive: true
    cmds:
      - npx --no-install vite

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf dist
