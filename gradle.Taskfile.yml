# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

# noinspection YAMLSchemaValidation
.kotlinSources: &kotlinSources
  - '**/*.kt'
  - '**/*.kts'

tasks:
  build:
    desc: Build and check every JVM module
    sources: *kotlinSources
    cmds:
      - ./gradlew build

  checkFormatting:
    desc: Check Kotlin formatting across every module
    sources: *kotlinSources
    cmds:
      - ./gradlew ktfmtCheck

  fixFormatting:
    desc: Fix Kotlin formatting across every module
    sources: *kotlinSources
    cmds:
      - ./gradlew ktfmtFormat

  run:
    desc: Run the backend locally, on a port it chooses and prints, against an embedded Postgres
    interactive: true
    cmds:
      - ./gradlew :backend:local-stack:run --console=plain
